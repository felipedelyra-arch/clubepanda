<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="clube_panda">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Clube Panda — Tio Panda</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Demo: remove qualquer service worker antigo e limpa caches
    // pra sempre carregar a versão mais recente do app.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      });
    }
    if (window.caches) {
      caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
    }
  </script>
  <style>
    #panda-splash{position:fixed;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:20px;background:#F47A20;z-index:9999;
      transition:opacity .4s ease}
    #panda-splash img{width:120px;height:120px;border-radius:50%;
      box-shadow:0 8px 30px rgba(0,0,0,.25)}
    #panda-splash .t{color:#fff;font-family:sans-serif;font-weight:700;font-size:20px}
    #panda-splash .s{width:34px;height:34px;border:3px solid rgba(255,255,255,.4);
      border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <div id="panda-splash">
    <img src="assets/assets/logo/panda_logo.png" alt="Clube Panda"
         onerror="this.style.display='none'"/>
    <div class="t">Clube Panda</div>
    <div class="s"></div>
  </div>
  <script>
    // Some o splash quando o Flutter renderiza o primeiro frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('panda-splash');
      if (s) { s.style.opacity = '0'; setTimeout(function(){ s.remove(); }, 400); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
